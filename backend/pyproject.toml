[project]
name = "ask-devraj-api"
version = "0.1.0"
description = "Ask Devraj: a LangGraph RAG agent that answers questions about Devraj Gaikwad"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.6",
    "fastembed>=0.9.1",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
